server {
    listen       80;
    server_name  localhost;
    # The SPA route /downloads shares a name with the static asset directory.
    # Avoid nginx's automatic slash redirect so React Router receives it.
    location = /downloads {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    # Vite emits content-hashed assets. Missing assets must be a real 404;
    # serving index.html here causes browsers to reject HTML as JS/CSS.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Always revalidate the SPA shell so it cannot reference assets from an
    # older deployment after a rollout.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
    location /api/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /ws/ {
        proxy_pass http://nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

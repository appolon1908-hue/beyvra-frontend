server {
    listen 8080;
    server_name ${PUBLIC_SERVER_NAME};

    root /usr/share/nginx/html;
    client_max_body_size 25M;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header Cache-Control "$beyvra_cache_control" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://${PUBLIC_SERVER_NAME} wss://${PUBLIC_SERVER_NAME} https://api.segment.io; frame-src 'self' https://accounts.google.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /config.js {
        alias /tmp/beyvra-runtime/config.js;
        default_type application/javascript;
    }

    location = /__runtime-config.json {
        alias /tmp/beyvra-runtime/config.json;
        default_type application/json;
    }

    location = /__release.json {
        alias /tmp/beyvra-runtime/release.json;
        default_type application/json;
    }

    location = /downloads {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location /ws/ {
        proxy_pass http://${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /50x.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
}

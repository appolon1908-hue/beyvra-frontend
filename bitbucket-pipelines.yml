image: node:22-bookworm-slim

pipelines:
  default:
    - step:
        name: Frontend validation
        caches:
          - node
        script:
          - cd client-portal
          - npm ci
          - npm run lint
          - npm run build
  branches:
    main:
      - step:
          name: Build production image
          services:
            - docker
          script:
            - docker build -f client-portal/Dockerfile.prod -t tradx-front:${BITBUCKET_COMMIT} client-portal

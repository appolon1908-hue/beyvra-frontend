name: Localization

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client-portal/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run test:chart
      - run: npm audit --audit-level=critical

  exact-head-base-ci:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact tuple at start
        run: |
          observed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}")
          test "$(jq -r .head.sha <<<"$observed")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r .base.sha <<<"$observed")" = "$EXPECTED_BASE_SHA"
          printf 'EXPECTED_HEAD_SHA=%s\nEXPECTED_BASE_SHA=%s\nOBSERVED_HEAD_SHA=%s\nOBSERVED_BASE_SHA=%s\n' "$EXPECTED_HEAD_SHA" "$EXPECTED_BASE_SHA" "$(jq -r .head.sha <<<"$observed")" "$(jq -r .base.sha <<<"$observed")"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - name: Verify exact tuple and ancestry at end
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch origin "$EXPECTED_BASE_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          observed=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}")
          test "$(jq -r .head.sha <<<"$observed")" = "$EXPECTED_HEAD_SHA"
          test "$(jq -r .base.sha <<<"$observed")" = "$EXPECTED_BASE_SHA"

name: Certify deployed immutable Beyvra frontend

on:
  workflow_run:
    workflows: ["Publish and deploy immutable Beyvra frontend"]
    types: [completed]

concurrency:
  group: beyvra-frontend-certification-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  inspect:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.manifest.outputs.source_sha }}
      frontend_image: ${{ steps.manifest.outputs.frontend_image }}
      backend_source_sha: ${{ steps.manifest.outputs.backend_source_sha }}
      backend_image: ${{ steps.manifest.outputs.backend_image }}
      backend_certification_run_id: ${{ steps.manifest.outputs.backend_certification_run_id }}
      target: ${{ steps.manifest.outputs.target }}
      change_id: ${{ steps.manifest.outputs.change_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
      DEPLOY_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: manifest
        name: Inspect checksum-verified deployment manifest
        run: operations/inspect_deployment_run.sh

  certify:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: ${{ needs.inspect.outputs.target }}
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      PUBLIC_SERVER_NAME: ${{ vars.PUBLIC_SERVER_NAME }}
      VERIFICATION_BASE_URL: ${{ vars.VERIFICATION_BASE_URL }}
      BACKEND_NETWORK: ${{ vars.BACKEND_NETWORK }}
      BACKEND_UPSTREAM: ${{ vars.BACKEND_UPSTREAM }}
      PORT: ${{ vars.PORT }}
      CANARY_TRAFFIC_PERCENT: ${{ vars.CANARY_TRAFFIC_PERCENT }}
      EXTERNAL_CANARY_ROUTING_VERIFIED: ${{ vars.EXTERNAL_CANARY_ROUTING_VERIFIED }}
      BACKEND_REPOSITORY: appolon1908-hue/beyvra-backend
      BACKEND_SOURCE_SHA: ${{ needs.inspect.outputs.backend_source_sha }}
      BACKEND_IMAGE: ${{ needs.inspect.outputs.backend_image }}
      BACKEND_CERTIFICATION_RUN_ID: ${{ needs.inspect.outputs.backend_certification_run_id }}
      SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
      FRONTEND_IMAGE: ${{ needs.inspect.outputs.frontend_image }}
      DEPLOYMENT_TARGET: ${{ needs.inspect.outputs.target }}
      CHANGE_ID: ${{ needs.inspect.outputs.change_id }}
      RELEASE_ATTESTATION_TYPE: https://github.com/appolon1908-hue/beyvra-frontend/attestations/release/v1
      CERTIFICATION_ATTESTATION_TYPE: https://github.com/appolon1908-hue/beyvra-frontend/attestations/certification/v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: subject
        name: Validate exact frontend OCI subject
        shell: bash
        run: |
          set -euo pipefail
          subject_name="${FRONTEND_IMAGE%@*}"
          subject_digest="${FRONTEND_IMAGE#*@}"
          [[ "$subject_name" == ghcr.io/* ]]
          [[ "$subject_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'name=%s\n' "$subject_name" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$subject_digest" >>"$GITHUB_OUTPUT"

      - name: Reverify exact signed paired-backend certification
        env:
          BACKEND_CERTIFICATION_EVIDENCE_DIR: evidence/backend-certification
        run: operations/verify_backend_certification.sh

      - name: Create exact release predicate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg backend_source_sha "$BACKEND_SOURCE_SHA" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg backend_certification_run_id "$BACKEND_CERTIFICATION_RUN_ID" \
            --arg target "$DEPLOYMENT_TARGET" \
            --arg change_id "$CHANGE_ID" \
            --arg deploy_run_id "$DEPLOY_RUN_ID" \
            --arg signed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              frontend_image: $frontend_image,
              backend_source_sha: $backend_source_sha,
              backend_image: $backend_image,
              backend_certification_run_id: $backend_certification_run_id,
              target: $target,
              change_id: $change_id,
              deploy_run_id: $deploy_run_id,
              signed_at: $signed_at,
              deployment_read_only: true,
              paired_backend_certification_verified: true,
              live_trading_authorized: false,
              real_money_authorized: false,
              payments_authorized: false,
              withdrawals_authorized: false,
              transactional_email_authorized: false,
              external_execution_authorized: false,
              certification_pending: true
            }' > evidence/release-attestation-predicate.json

      - id: attest_release
        name: Sign exact frontend release identity
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          predicate-type: ${{ env.RELEASE_ATTESTATION_TYPE }}
          predicate-path: evidence/release-attestation-predicate.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify exact frontend release signature
        shell: bash
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/certify-deployment.yml"
          gh attestation verify "oci://${FRONTEND_IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --source-ref refs/heads/main \
            --predicate-type "$RELEASE_ATTESTATION_TYPE" \
            --format json \
            > evidence/frontend-release-attestation-verification.json
          jq -e 'type == "array" and length > 0' \
            evidence/frontend-release-attestation-verification.json >/dev/null

      - name: Run exact-source frontend certification and rollback rehearsal
        run: operations/run_deployment_certification.sh

      - name: Verify rollback and restored-candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rollback_files < <(
            find evidence -type f -name rollback-rehearsal.json -print
          )
          [[ "${#rollback_files[@]}" -eq 1 ]]
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg frontend_image "$FRONTEND_IMAGE" '
              .rollback_result == "PASS" and
              .candidate_restore_result == "PASS" and
              .candidate_source_sha == $source_sha and
              .candidate_image == $frontend_image and
              .rpo == 0 and
              .static_integrity_unchanged == true and
              .deployment_read_only == true and
              .live_effects_authorized == false
            ' "${rollback_files[0]}" >/dev/null

      - name: Create successful certification predicate and promotion manifest
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg backend_source_sha "$BACKEND_SOURCE_SHA" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg backend_certification_run_id "$BACKEND_CERTIFICATION_RUN_ID" \
            --arg target "$DEPLOYMENT_TARGET" \
            --arg change_id "$CHANGE_ID" \
            --arg deploy_run_id "$DEPLOY_RUN_ID" \
            --arg certification_run_id "$GITHUB_RUN_ID" \
            --arg certified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              frontend_image: $frontend_image,
              backend_source_sha: $backend_source_sha,
              backend_image: $backend_image,
              backend_certification_run_id: $backend_certification_run_id,
              target: $target,
              change_id: $change_id,
              deploy_run_id: $deploy_run_id,
              certification_run_id: $certification_run_id,
              certified_at: $certified_at,
              certification_result: "PASS",
              rollback_rehearsal: "PASS",
              paired_backend_certification: "PASS",
              signed_provenance_verified: true,
              deployment_read_only: true,
              live_trading_authorized: false,
              real_money_authorized: false,
              payments_authorized: false,
              withdrawals_authorized: false,
              transactional_email_authorized: false,
              external_execution_authorized: false,
              legacy_realtime_fallback_enabled: false
            }' > evidence/certification-attestation-predicate.json

          if [[ "$DEPLOYMENT_TARGET" == "staging-readonly" ]]; then
            cp evidence/certification-attestation-predicate.json \
              evidence/production-promotion-manifest.json
            (
              cd evidence
              sha256sum production-promotion-manifest.json \
                > production-promotion-manifest.json.sha256
            )
          fi

      - id: attest_certification
        name: Sign successful frontend certification
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          predicate-type: ${{ env.CERTIFICATION_ATTESTATION_TYPE }}
          predicate-path: evidence/certification-attestation-predicate.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify successful frontend certification signature
        shell: bash
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/certify-deployment.yml"
          gh attestation verify "oci://${FRONTEND_IMAGE}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --source-ref refs/heads/main \
            --predicate-type "$CERTIFICATION_ATTESTATION_TYPE" \
            --format json \
            > evidence/frontend-certification-attestation-verification.json
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg backend_source_sha "$BACKEND_SOURCE_SHA" \
            --arg backend_image "$BACKEND_IMAGE" '
              any(.[];
                .verificationResult.statement.predicate.source_sha == $source_sha and
                .verificationResult.statement.predicate.frontend_image == $frontend_image and
                .verificationResult.statement.predicate.backend_source_sha == $backend_source_sha and
                .verificationResult.statement.predicate.backend_image == $backend_image and
                .verificationResult.statement.predicate.certification_result == "PASS" and
                .verificationResult.statement.predicate.rollback_rehearsal == "PASS" and
                .verificationResult.statement.predicate.paired_backend_certification == "PASS" and
                .verificationResult.statement.predicate.deployment_read_only == true
              )
            ' evidence/frontend-certification-attestation-verification.json >/dev/null

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: beyvra-frontend-certification-${{ needs.inspect.outputs.target }}-${{ needs.inspect.outputs.change_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

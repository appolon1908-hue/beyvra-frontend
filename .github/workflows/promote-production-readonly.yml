name: Promote certified Beyvra frontend to production read-only

on:
  workflow_dispatch:
    inputs:
      frontend_staging_certification_run_id:
        description: Successful frontend staging certification workflow run ID
        required: true
        type: string
      backend_production_certification_run_id:
        description: Successful matching backend production-readonly certification run ID
        required: true
        type: string
      change_id:
        description: Auditable frontend production change identifier
        required: true
        type: string
      deploy:
        description: Dispatch the exact certified candidate
        required: true
        default: false
        type: boolean

concurrency:
  group: beyvra-frontend-production-readonly-promotion
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read
  attestations: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.manifest.outputs.source_sha }}
      frontend_image: ${{ steps.manifest.outputs.frontend_image }}
      backend_source_sha: ${{ steps.manifest.outputs.backend_source_sha }}
      backend_image: ${{ steps.manifest.outputs.backend_image }}
      staging_change_id: ${{ steps.manifest.outputs.staging_change_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      FRONTEND_CERTIFICATION_RUN_ID: ${{ inputs.frontend_staging_certification_run_id }}
      BACKEND_PRODUCTION_CERTIFICATION_RUN_ID: ${{ inputs.backend_production_certification_run_id }}
      PRODUCTION_CHANGE_ID: ${{ inputs.change_id }}
      FRONTEND_CERTIFICATION_ATTESTATION_TYPE: https://github.com/appolon1908-hue/beyvra-frontend/attestations/certification/v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: manifest
        name: Verify signed frontend staging certification
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRONTEND_CERTIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$BACKEND_PRODUCTION_CERTIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$PRODUCTION_CHANGE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${{ inputs.deploy }}" == "true" ]]

          run="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${FRONTEND_CERTIFICATION_RUN_ID}"
          )"
          jq -e '
            .name == "Certify deployed immutable Beyvra frontend" and
            .event == "workflow_run" and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "success"
          ' <<<"$run" >/dev/null

          rm -rf frontend-staging-certification promotion-evidence
          mkdir -p frontend-staging-certification promotion-evidence
          gh run download "$FRONTEND_CERTIFICATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'beyvra-frontend-certification-staging-readonly-*' \
            --dir frontend-staging-certification

          mapfile -t manifests < <(
            find frontend-staging-certification -type f \
              -name production-promotion-manifest.json -print
          )
          [[ "${#manifests[@]}" -eq 1 ]]
          manifest="${manifests[0]}"
          manifest_dir="$(dirname "$manifest")"
          (
            cd "$manifest_dir"
            sha256sum -c production-promotion-manifest.json.sha256
          )

          source_sha="$(jq -r .source_sha "$manifest")"
          frontend_image="$(jq -r .frontend_image "$manifest")"
          backend_source_sha="$(jq -r .backend_source_sha "$manifest")"
          backend_image="$(jq -r .backend_image "$manifest")"
          staging_change_id="$(jq -r .change_id "$manifest")"

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$frontend_image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$backend_source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$backend_image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$staging_change_id" =~ ^[A-Za-z0-9._-]+$ ]]

          jq -e '
            .target == "staging-readonly" and
            .certification_result == "PASS" and
            .rollback_rehearsal == "PASS" and
            .paired_backend_certification == "PASS" and
            .signed_provenance_verified == true and
            .deployment_read_only == true and
            .live_trading_authorized == false and
            .real_money_authorized == false and
            .payments_authorized == false and
            .withdrawals_authorized == false and
            .transactional_email_authorized == false and
            .external_execution_authorized == false and
            .legacy_realtime_fallback_enabled == false
          ' "$manifest" >/dev/null

          git cat-file -e "${source_sha}^{commit}"
          git merge-base --is-ancestor "$source_sha" origin/main

          signer="$GITHUB_REPOSITORY/.github/workflows/certify-deployment.yml"
          gh attestation verify "oci://${frontend_image}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" \
            --source-ref refs/heads/main \
            --predicate-type "$FRONTEND_CERTIFICATION_ATTESTATION_TYPE" \
            --format json \
            > promotion-evidence/frontend-certification-attestation.json

          jq -e \
            --arg source_sha "$source_sha" \
            --arg frontend_image "$frontend_image" \
            --arg backend_source_sha "$backend_source_sha" \
            --arg backend_image "$backend_image" '
              any(.[];
                .verificationResult.statement.predicate.source_sha == $source_sha and
                .verificationResult.statement.predicate.frontend_image == $frontend_image and
                .verificationResult.statement.predicate.backend_source_sha == $backend_source_sha and
                .verificationResult.statement.predicate.backend_image == $backend_image and
                .verificationResult.statement.predicate.target == "staging-readonly" and
                .verificationResult.statement.predicate.certification_result == "PASS" and
                .verificationResult.statement.predicate.rollback_rehearsal == "PASS" and
                .verificationResult.statement.predicate.paired_backend_certification == "PASS" and
                .verificationResult.statement.predicate.deployment_read_only == true
              )
            ' promotion-evidence/frontend-certification-attestation.json >/dev/null

          docker pull "$frontend_image"
          test "$(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$frontend_image"
          )" = "$source_sha"

          cp "$manifest" promotion-evidence/frontend-staging-promotion-manifest.json
          printf 'source_sha=%s\n' "$source_sha" >>"$GITHUB_OUTPUT"
          printf 'frontend_image=%s\n' "$frontend_image" >>"$GITHUB_OUTPUT"
          printf 'backend_source_sha=%s\n' "$backend_source_sha" >>"$GITHUB_OUTPUT"
          printf 'backend_image=%s\n' "$backend_image" >>"$GITHUB_OUTPUT"
          printf 'staging_change_id=%s\n' "$staging_change_id" >>"$GITHUB_OUTPUT"

      - name: Verify matching signed backend production certification
        env:
          BACKEND_REPOSITORY: appolon1908-hue/beyvra-backend
          BACKEND_CERTIFICATION_RUN_ID: ${{ inputs.backend_production_certification_run_id }}
          BACKEND_SOURCE_SHA: ${{ steps.manifest.outputs.backend_source_sha }}
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
          DEPLOYMENT_TARGET: production-readonly
          BACKEND_CERTIFICATION_EVIDENCE_DIR: promotion-evidence/backend-production-certification
        run: operations/verify_backend_certification.sh

  authorize:
    needs: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-readonly
    env:
      CANARY_TRAFFIC_PERCENT: ${{ vars.CANARY_TRAFFIC_PERCENT }}
      EXTERNAL_CANARY_ROUTING_VERIFIED: ${{ vars.EXTERNAL_CANARY_ROUTING_VERIFIED }}
    steps:
      - name: Enforce protected production canary boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANARY_TRAFFIC_PERCENT" =~ ^(0|1)$ ]]
          [[ "$EXTERNAL_CANARY_ROUTING_VERIFIED" == "true" ]]

  dispatch:
    needs:
      - inspect
      - authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
      FRONTEND_IMAGE: ${{ needs.inspect.outputs.frontend_image }}
      BACKEND_SOURCE_SHA: ${{ needs.inspect.outputs.backend_source_sha }}
      BACKEND_IMAGE: ${{ needs.inspect.outputs.backend_image }}
      BACKEND_CERTIFICATION_RUN_ID: ${{ inputs.backend_production_certification_run_id }}
      STAGING_CHANGE_ID: ${{ needs.inspect.outputs.staging_change_id }}
      PRODUCTION_CHANGE_ID: ${{ inputs.change_id }}
      FRONTEND_CERTIFICATION_RUN_ID: ${{ inputs.frontend_staging_certification_run_id }}
    steps:
      - name: Dispatch same-digest production read-only candidate
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          git_source="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}" --jq .sha)"
          test "$git_source" = "$SOURCE_SHA"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -f ref=main \
            -f "inputs[source_sha]=$SOURCE_SHA" \
            -f "inputs[target]=production-readonly" \
            -f "inputs[publish_image]=false" \
            -f "inputs[frontend_image]=$FRONTEND_IMAGE" \
            -f "inputs[backend_source_sha]=$BACKEND_SOURCE_SHA" \
            -f "inputs[backend_image]=$BACKEND_IMAGE" \
            -f "inputs[backend_certification_run_id]=$BACKEND_CERTIFICATION_RUN_ID" \
            -f "inputs[deploy]=true" \
            -f "inputs[change_id]=$PRODUCTION_CHANGE_ID"

          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg backend_source_sha "$BACKEND_SOURCE_SHA" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg backend_certification_run_id "$BACKEND_CERTIFICATION_RUN_ID" \
            --arg staging_change_id "$STAGING_CHANGE_ID" \
            --arg production_change_id "$PRODUCTION_CHANGE_ID" \
            --arg frontend_certification_run_id "$FRONTEND_CERTIFICATION_RUN_ID" \
            --arg dispatched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              frontend_image: $frontend_image,
              backend_source_sha: $backend_source_sha,
              backend_image: $backend_image,
              backend_certification_run_id: $backend_certification_run_id,
              staging_change_id: $staging_change_id,
              production_change_id: $production_change_id,
              frontend_certification_run_id: $frontend_certification_run_id,
              dispatched_at: $dispatched_at,
              target: "production-readonly",
              publish_image: false,
              canary_traffic_maximum_percent: 1,
              deployment_read_only: true,
              live_effects_authorized: false
            }' > production-promotion-dispatch.json

      - uses: actions/upload-artifact@v7
        with:
          name: beyvra-frontend-production-promotion-${{ inputs.change_id }}
          path: production-promotion-dispatch.json
          if-no-files-found: error
          retention-days: 90

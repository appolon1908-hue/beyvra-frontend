name: PAPER fixture contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  paper-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client-portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run scripts/e2e-session.test.ts
      - run: node --test scripts/realtime-load.test.mjs
      - run: npx playwright test --list

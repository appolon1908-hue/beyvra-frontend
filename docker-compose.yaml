services:
  frontend:
    build:
      context: ./client-portal
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api}
        VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-ws://localhost:8081}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081/api}
      VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-ws://localhost:8081}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

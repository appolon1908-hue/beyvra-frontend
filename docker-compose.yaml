services:
  frontend:
    image: ${FRONTEND_IMAGE:-front-frontend:local}
    build:
      context: ./client-portal
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-AUTO}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://staging.beyvra.com}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Beyvra}
        VITE_REALTIME_V2_ENABLED: ${VITE_REALTIME_V2_ENABLED:-false}
        VITE_REALTIME_V2_V1_FALLBACK_ENABLED: ${VITE_REALTIME_V2_V1_FALLBACK_ENABLED:-true}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-AUTO}
      VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://staging.beyvra.com}
      VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Beyvra}
    networks:
      - trading-network
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  edge:
    image: caddy:2.10-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-staging.beyvra.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile.staging}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - trading-network
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  trading-network:
    external: true

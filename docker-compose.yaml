services:
  frontend:
    build:
      context: ./client-portal
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-AUTO}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-AUTO}
    networks:
      - trading-network
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

  edge:
    image: caddy:2.10-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${CADDYFILE:-./deploy/Caddyfile.staging}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - trading-network
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  trading-network:
    external: true
